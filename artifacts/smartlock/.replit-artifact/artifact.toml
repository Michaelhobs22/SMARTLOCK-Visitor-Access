kind = "web"
previewPath = "/smartlock/"
title = "SMARTLOCK"
description = "An authenticated residential visitor-access app. Residents create, share, and manage temporary QR passes across devices; a simulated reader checks pass status but does not control physical locks."
version = "1.0.0"
id = "artifacts/smartlock"
router = "path"

[[services]]
name = "web"
paths = [ "/smartlock/" ]
localPort = 22578

[services.development]
run = "pnpm --filter @workspace/smartlock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartlock", "run", "build" ]
serve = "static"
publicDir = "artifacts/smartlock/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22578"
BASE_PATH = "/smartlock/"
